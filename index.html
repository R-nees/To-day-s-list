<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple, fast, clean to-do list app to manage tasks and stay organized.">
  <meta name="keywords" content="to-do list, todo app, task manager, checklist, productivity app">
  <meta name="author" content="Arnes">
  <meta name="robots" content="index, follow">
  <title>Simple To-Do List</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <h1> To-Day's List</h1>

    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Enter a new task..." />
      <button id="addBtn">Add</button>
    </div>

    <p class="task-counter">
      Tasks: <span id="taskCount">0</span>
    </p>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
